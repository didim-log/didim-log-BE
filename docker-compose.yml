services:
  didim-log-be:
    image: stdiodh/didim-log-be:latest
    container_name: didim-log-be-container
    expose:
      - "8080"
    env_file:
      - .env
    networks:
      - didim-log-network
    restart: always
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:latest
    container_name: didim-log-be-mongodb-container
    restart: always
    volumes:
      - mongodb-data:/data/db
    networks:
      - didim-log-network

  redis:
    image: redis:alpine
    container_name: didim-log-be-redis-container
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - didim-log-network

  nginx:
    image: nginx:latest
    container_name: didimlog-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - didim-log-network
    restart: always
    depends_on:
      - didim-log-be

  certbot:
    image: certbot/certbot
    container_name: didimlog-certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - didim-log-network
    restart: always

networks:
  didim-log-network:
    driver: bridge

volumes:
  mongodb-data:
  redis-data:
