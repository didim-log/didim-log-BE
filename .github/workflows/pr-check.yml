name: PR Check

on:
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - 'README.md'
      - 'DOCS/**'
      - 'SECRET_DOCS/**'
      - '.gitignore'
      - '.cursorrules'
      - '*.md'

jobs:
  unit-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --log-driver none
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --log-driver none

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: ./gradlew test

  integration-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --log-driver none
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --log-driver none

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run integration tests and merged coverage
        env:
          SERVER_URL: https://dummy-server.com
        run: ./gradlew clean check --no-daemon

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            build/reports/jacoco/
            build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  performance-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned k6
        run: |
          K6_VERSION="$(cat performance/k6/K6_VERSION)"
          curl -fsSLO "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz"
          tar -xzf "k6-${K6_VERSION}-linux-amd64.tar.gz"
          sudo mv "k6-${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      - name: Validate performance assets
        run: |
          bash -n performance/k6/run-local.sh
          bash -n performance/verify/verify_ai_call_count.sh
          node --check performance/mock-external/gemini/node-mock/server.js
          find performance/k6 -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m json.tool performance/mock-external/gemini/mappings/gemini-failure-once-start.json
          python3 -m json.tool performance/mock-external/gemini/mappings/gemini-failure-once-success.json
          python3 -m json.tool performance/mock-external/gemini/mappings/gemini-generate-content.json
          python3 -m json.tool performance/mock-external/gemini/responses/gemini-success.json
          docker compose -f performance/mock-external/docker-compose.performance.yml config
          k6 inspect performance/k6/smoke.js
          k6 inspect performance/k6/read-workload.js
          k6 inspect performance/k6/ai-review-concurrency.js
          k6 inspect performance/k6/auth-rate-limit.js
          git diff --check
