spring:
  application:
    name: didim-log

  config:
    import: optional:file:.env[.properties]

  data:
    mongodb:
      auto-index-creation: false

  # Swagger UI 접근을 위한 HTTP Basic Authentication 설정
  security:
    user:
      name: ${SWAGGER_USERNAME:admin}
      password: ${SWAGGER_PASSWORD:admin123}
    oauth2:
      client:
        registration:
          # Google OAuth2 설정
          # 환경 변수: OAUTH_GOOGLE_ID, OAUTH_GOOGLE_SECRET
          # 설정 방법: Google Cloud Console에서 OAuth 2.0 클라이언트 ID 생성 후 환경 변수에 설정
          google:
            client-id: ${OAUTH_GOOGLE_ID}
            client-secret: ${OAUTH_GOOGLE_SECRET}
            scope:
              - profile
              - email
          # GitHub OAuth2 설정
          # 환경 변수: OAUTH_GITHUB_ID, OAUTH_GITHUB_SECRET
          # 설정 방법: GitHub Developer Settings에서 OAuth App 생성 후 환경 변수에 설정
          github:
            client-id: ${OAUTH_GITHUB_ID}
            client-secret: ${OAUTH_GITHUB_SECRET}
            scope:
              - user:email
              - read:user
          # Naver OAuth2 설정
          # 환경 변수: OAUTH_NAVER_ID, OAUTH_NAVER_SECRET
          # 설정 방법: Naver Developers에서 애플리케이션 등록 후 환경 변수에 설정
          naver:
            client-id: ${OAUTH_NAVER_ID}
            client-secret: ${OAUTH_NAVER_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Naver
            scope:
              - name
              - email
              - profile_image
        provider:
          # Naver Provider 설정 (별도 설정 필요)
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response # Naver는 response 속성 사용

  # SMTP 이메일 발송 설정
  # 로컬 테스트 시 IntelliJ 환경 변수 설정 방법:
  # Run/Debug Configurations -> Environment variables에 MAIL_PASSWORD=앱비밀번호 추가
  # 또는 .env 파일에 MAIL_PASSWORD=앱비밀번호 추가
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:didimlognoreply@gmail.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: INFO

server:
  forward-headers-strategy: framework

app:
  server:
    url: ${SERVER_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
    # Access Token: 30분 (유휴 상태 시 보안을 위해 짧게 유지)
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000} # 30분 (밀리초)
    # Refresh Token: 7일 (사용자 편의를 위해 로그인 유지) - 향후 구현 예정
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7일 (밀리초)
    # 하위 호환성을 위해 expiration도 유지 (access-token-expiration과 동일)
    expiration: ${JWT_EXPIRATION:1800000} # 30분 (밀리초) - access-token-expiration과 동일
  oauth:
    exchange-code-ttl-seconds: ${OAUTH_EXCHANGE_CODE_TTL_SECONDS:120}
  cors:
    # (Legacy) 기존 설정 키. 하위 호환을 위해 남겨둔다.
    # 운영 환경에서는 환경 변수로 주입하여 사용한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  admin:
    # 슈퍼 관리자 계정 생성용 보안 키
    # 로컬 개발 시 .env 파일에 ADMIN_SECRET_KEY 설정 필요
    # 프로덕션에서는 환경 변수로 주입 (기본값 없음)
    secret-key: ${ADMIN_SECRET_KEY:}
  template:
    # 템플릿 렌더링 최대 대기 시간(ms). 초과 시 TEMPLATE_RENDER_TIMEOUT(504) 반환
    render-timeout-millis: ${TEMPLATE_RENDER_TIMEOUT_MILLIS:4000}
    # 렌더 타임아웃 시 기본 템플릿 fallback 반환 여부
    timeout-fallback-enabled: ${TEMPLATE_TIMEOUT_FALLBACK_ENABLED:true}
  retrospective:
    # 회고 작성일 기준 자동 정리 기간
    retention-days: ${RETROSPECTIVE_RETENTION_DAYS:180}

# CORS 설정 (권장)
# 배포 환경에서는 ALLOWED_ORIGINS 환경 변수만 변경하면 코드 수정 없이 Origin을 조정할 수 있다.
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  oauth:
    redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:5173/oauth/callback}
  # AI 서비스 활성화 여부 (기본값: false)
  # true로 설정하면 정적 템플릿에 AI 키워드가 주입됩니다.
  ai:
    enabled: ${AI_ENABLED:false}

ai:
  # AI 서비스 활성화 여부 (기본값: false)
  # true로 설정하면 키워드 추출 기능이 활성화됩니다.
  enabled: ${AI_ENABLED:false}
  review:
    async:
      core-pool-size: ${AI_REVIEW_ASYNC_CORE_POOL_SIZE:2}
      max-pool-size: ${AI_REVIEW_ASYNC_MAX_POOL_SIZE:4}
      queue-capacity: ${AI_REVIEW_ASYNC_QUEUE_CAPACITY:200}
  gemini:
    # 운영/로컬 환경변수로 주입 (하드코딩 금지)
    api-key: ${GEMINI_API_KEY:}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
    connect-timeout-millis: ${GEMINI_CONNECT_TIMEOUT_MILLIS:3000}
    response-timeout-seconds: ${GEMINI_RESPONSE_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${GEMINI_READ_TIMEOUT_SECONDS:10}
    write-timeout-seconds: ${GEMINI_WRITE_TIMEOUT_SECONDS:10}
    max-retries: ${GEMINI_MAX_RETRIES:1}
    retry-backoff-millis: ${GEMINI_RETRY_BACKOFF_MILLIS:700}
